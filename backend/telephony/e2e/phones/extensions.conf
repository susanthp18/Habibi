; Scripted callers for the telephony e2e suite (backend/tests/e2e_telephony).
; Every script records what the phone heard and said, named by ${REC}, into the
; ARI stored-recordings directory so the test can fetch them.

[macro-record]
exten => s,1,Set(REC=${IF($["${REC}" = ""]?${UNIQUEID}:${REC})})
 same => n,MixMonitor(/var/spool/asterisk/recording/${REC}-mix.wav,r(/var/spool/asterisk/recording/${REC}-heard.wav)t(/var/spool/asterisk/recording/${REC}-said.wav))
 same => n,Return()

; Talks through a collections call: greeting, reason, a keypress, goodbye.
[borrower]
exten => s,1,Gosub(macro-record,s,1)
 same => n,Wait(7)
 same => n,Playback(/snd/hello)
 same => n,Wait(9)
 same => n,Playback(/snd/payment)
 same => n,Wait(10)
 same => n,SendDTMF(1)
 same => n,Wait(8)
 same => n,Playback(/snd/bye)
 same => n,Wait(8)
 same => n,Hangup()

; Presses a key and says NOTHING else. The borrower script above also sends a
; digit, but it speaks 8 seconds later -- so the digits fold into that spoken
; turn and the test passes whether or not the keypress itself was ever answered.
; This script removes the speech, so only a real keypad turn can produce a
; reply. The 14s tail is longer than a reply needs and shorter than two idle
; strikes, so an answer here is the keypad turn and not the idle ladder.
[keypad]
exten => s,1,Gosub(macro-record,s,1)
 same => n,Wait(8)
 same => n,SendDTMF(4)
 same => n,Wait(14)
 same => n,Hangup()

; Speaks, then hangs up mid-conversation: the caller ends the call, not the bot.
[caller-hangs-up]
exten => s,1,Gosub(macro-record,s,1)
 same => n,Wait(6)
 same => n,Playback(/snd/payment)
 same => n,Wait(3)
 same => n,Hangup()

; Says nothing: the bot has to carry the silence and end the call itself.
[silent]
exten => s,1,Gosub(macro-record,s,1)
 same => n,Wait(45)
 same => n,Hangup()

; Asks for a person and waits to be transferred.
[human]
exten => s,1,Gosub(macro-record,s,1)
 same => n,Wait(7)
 same => n,Playback(/snd/agent)
 same => n,Wait(50)
 same => n,Hangup()

; Talks over the greeting, then waits.
[bargein]
exten => s,1,Gosub(macro-record,s,1)
 same => n,Wait(1)
 same => n,Playback(/snd/payment)
 same => n,Wait(30)
 same => n,Hangup()

; Calls the PBX places. 1001 behaves as the global BORROWER_MODE says;
; 1002 is the human agent the collections queue rings.
[incoming]
exten => 1001,1,NoOp(e2e borrower mode=${BORROWER_MODE})
 same => n,GotoIf($["${BORROWER_MODE}" = "busy"]?busy)
 same => n,GotoIf($["${BORROWER_MODE}" = "noanswer"]?noanswer)
 same => n,GotoIf($["${BORROWER_MODE}" = "reject"]?reject)
 same => n,GotoIf($["${BORROWER_MODE}" = "hangup"]?hangup)
 same => n,Answer()
 same => n,Set(REC=${BORROWER_REC})
 same => n,Goto(borrower,s,1)
 same => n(busy),Busy(5)
 same => n(noanswer),Ringing()
 same => n,Wait(120)
 same => n(reject),Hangup(21)
 same => n(hangup),Answer()
 same => n,Set(REC=${BORROWER_REC})
 same => n,Goto(caller-hangs-up,s,1)

exten => 1002,1,Answer()
 same => n,Set(GLOBAL(AGENT_ANSWERED)=${EPOCH})
 same => n,Playback(/snd/hello)
 same => n,Wait(15)
 same => n,Hangup()
