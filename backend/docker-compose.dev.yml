# Developer overlay — bind-mounts the working tree over the image's /app.
#
# Without this, `docker compose exec api pytest` runs the code that was baked in
# at build time, not the code you just edited, and a green run means nothing.
# Opt in explicitly so the default `docker compose up` still exercises the image
# as it will actually ship:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d api
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml exec api pytest tests/
#
# __pycache__ is masked with an anonymous volume: the host tree carries .pyc
# files compiled by a different Python, and a stale one shadows the source.

services:
  api:
    environment:
      # Laptop bind-mount is not a deployed image. HABIBI_DEPLOYED stays 1 on
      # docker-compose.yml so shipping containers remain hardened.
      HABIBI_DEPLOYED: "0"
      # The console sends X-Actor-User-Id behind the shared API_KEY. Off by
      # default everywhere (WP-070); the laptop stack opts in here.
      ALLOW_ACTOR_HEADER: "true"
    volumes:
      - .:/app
      - /app/__pycache__
      - ../source_db:/source_db:ro

  worker:
    environment:
      HABIBI_DEPLOYED: "0"

  wk_batch:
    environment:
      HABIBI_DEPLOYED: "0"
      W6_ALLOW_PRIMARY_REPORTING: "true"

  bot_worker:
    environment:
      HABIBI_DEPLOYED: "0"
    # It dials (cadence, campaigns, treatment): without the mount it ran the
    # image's stale outbound code while the api ran the working tree.
    volumes:
      - .:/app
      - /app/__pycache__

  # The test runner: the app image plus pytest, on the working tree.
  #   docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile tests up -d tests
  #   docker exec collections_tests pytest -q
  tests:
    profiles: [tests]
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: collections-dev:local
    container_name: collections_tests
    env_file:
      - .env
    environment:
      HABIBI_DEPLOYED: "0"
      DATABASE_URL: postgresql+psycopg://${APP_DB_USER:-collections_app}:${APP_DB_PASSWORD:-collections_app}@db:5432/${POSTGRES_DB:-collections}
      MINIO_ENDPOINT: minio:9000
      MINIO_SECURE: "false"
      # The suite runs here as the app role; tests of the owner's path (audit
      # maintenance, DDL) reach the owner through this DSN and skip without it.
      MIGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-collections}:${POSTGRES_PASSWORD:-collections}@db:5432/${POSTGRES_DB:-collections}
    volumes:
      - .:/app
      - /app/__pycache__
    command: ["sleep", "infinity"]
    depends_on:
      db:
        condition: service_healthy

  # Something finally reads /metrics. Laptop only -- the production envelope
  # brings its own scraper -- so it lives in this overlay, not the base file.
  #   http://localhost:9090  (Status -> Targets shows habibi-api up)
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: collections_prometheus
    volumes:
      - ./ops/prometheus.dev.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      api:
        condition: service_healthy
