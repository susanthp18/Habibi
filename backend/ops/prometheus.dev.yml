# Laptop-only Prometheus (docker-compose.dev.yml `prometheus` service).
#
# Scrapes every process every 15 s. The dev stack runs with no API_KEY, so the
# API's route answers as ACTOR_USER_ID; a deployed scraper needs its own
# API_KEY_MAP entry for a service user holding perm-observability-read and
# sends it as X-API-Key (see routers/platform.py::metrics).
#
# The worker, bot_worker and voice processes bind a plain exposition server on
# METRICS_PORT (observability.serve_metrics; compose sets 9100). Their queues,
# breakers and -- for voice -- the admission gauges are published from the
# process that owns them, not read second-hand through the API.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: habibi-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
  - job_name: habibi-worker
    static_configs:
      - targets: ["worker:9100"]
  - job_name: habibi-bot-worker
    static_configs:
      - targets: ["bot_worker:9100"]
  - job_name: habibi-voice
    static_configs:
      - targets: ["voice:9100"]
