services:
  db:
    image: pgvector/pgvector:pg16
    container_name: collections_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-collections}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-collections}
      POSTGRES_DB: ${POSTGRES_DB:-collections}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-collections} -d ${POSTGRES_DB:-collections}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Phase KB-2 — object store for kb_source_files originals (RAG corpus only).
  minio:
    image: minio/minio:latest
    container_name: collections_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  minio_data:
