# Collections Agent — data plane + app processes.
#
# Connection budget (defaults below, sum ≈ 25):
#   api 5+5=10  +  worker 3+2=5  +  bot_worker 3+2=5  +  voice 3+2=5
# Stay under Postgres max_connections (100) − reserved (~10).
# Do NOT raise uvicorn --workers without re-budgeting.
#
# env_file: worker and bot_worker mount the full backend/.env
# (including Azure/Meta/Twilio secrets). For production, prefer per-service
# env_file lists or Docker secrets so sidecars only receive DB + REDIS + their
# own credentials. Local compose keeps .env for developer convenience.
#
# Quick start (from backend/):
#   docker compose up -d --build
#   docker compose exec api alembic upgrade head
#   docker compose exec api python scripts/seed_demo.py   # optional demo rows
#
# Release identity (WP-001). Defaults keep today's local names
# (`collections-api:local`, `collections-voice:local`). A published deploy
# sets both:
#   IMAGE_PREFIX=ghcr.io/<owner>/<repo>/   # trailing slash required
#   IMAGE_TAG=<40-char commit SHA>
# Rollback is two commands; see docs/ops/rollback.md. Do not `alembic downgrade`.

services:
  redis:
    image: redis:7-alpine
    container_name: collections_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: pgvector/pgvector:pg16
    container_name: collections_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-collections}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-collections}
      POSTGRES_DB: ${POSTGRES_DB:-collections}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-collections} -d ${POSTGRES_DB:-collections}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Pin by digest (not :latest). Tag RELEASE.2025-09-07T16-13-09Z — last official
  # Hub publish before MinIO went source-only for newer builds. Bump deliberately.
  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: collections_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in backend/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in backend/.env}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      # Server image ships `mc`; curl was dropped from newer MinIO builds.
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    image: "${IMAGE_PREFIX:-}collections-api:${IMAGE_TAG:-local}"
    container_name: collections_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-collections}:${POSTGRES_PASSWORD:-collections}@db:5432/${POSTGRES_DB:-collections}
      MINIO_ENDPOINT: minio:9000
      MINIO_SECURE: "false"
      DB_PROCESS_ROLE: api
      HABIBI_DEPLOYED: "1"
      DB_POOL_SIZE: ${API_DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${API_DB_MAX_OVERFLOW:-5}
      VOICE_RUNNER_URL: http://voice:7860
      REDIS_URL: redis://redis:6379/0
      VOICE_WS_VIA_API: "true"
      # Corpus on host at ../source_db — required for /kb/ingest/source-db + reindex.
      SOURCE_DB_ROOT: /source_db
      # Single worker — connection budget assumes 1× pool.
      UVICORN_WORKERS: "1"
      APP_RELEASE: ${IMAGE_TAG:-local}
    volumes:
      - ../source_db:/source_db:ro
      # Only used when voice_session_store falls back to the filesystem (no
      # database). Shared with `voice` so even that degraded path still lets the
      # bot see the session the API wrote — the containers do not otherwise
      # share a filesystem, which is what silently broke Sandbox Live config.
      - voice_sessions:/app/.cache/voice_sandbox_sessions
    command:
      [
        "uvicorn",
        "main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--workers",
        "1",
      ]
    ports:
      # Loopback by default: `8000:8000` publishes an unauthenticated-by-default
      # CRM API on every host interface. Production ingress should set
      # API_BIND=0.0.0.0 explicitly (behind a reverse proxy).
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    image: "${IMAGE_PREFIX:-}collections-api:${IMAGE_TAG:-local}"
    container_name: collections_kb_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-collections}:${POSTGRES_PASSWORD:-collections}@db:5432/${POSTGRES_DB:-collections}
      MINIO_ENDPOINT: minio:9000
      MINIO_SECURE: "false"
      DB_PROCESS_ROLE: worker
      HABIBI_DEPLOYED: "1"
      DB_POOL_SIZE: ${WORKER_DB_POOL_SIZE:-3}
      DB_MAX_OVERFLOW: ${WORKER_DB_MAX_OVERFLOW:-2}
      SOURCE_DB_ROOT: /source_db
      APP_RELEASE: ${IMAGE_TAG:-local}
    volumes:
      - ../source_db:/source_db:ro
    command: ["python", "-m", "worker"]
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      # No HTTP surface. Catches a dead PID 1; a wedged drain is not
      # observable from compose without a heartbeat the worker does not write.
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s

  # W6's batch plane: the daily feature snapshot, the PIT-skew audit and the
  # decision cost rollup. Separate from `worker` because it is role-scoped --
  # it performs no carrier or borrower-facing operation -- and because the
  # snapshot is the input `SnapshotFeatureProvider` serves from. Without this
  # service, migration 0113 makes `w6_ready` true, the engine switches to the
  # snapshot provider, and nothing ever builds a snapshot.
  wk_batch:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    image: "${IMAGE_PREFIX:-}collections-api:${IMAGE_TAG:-local}"
    container_name: collections_wk_batch
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-collections}:${POSTGRES_PASSWORD:-collections}@db:5432/${POSTGRES_DB:-collections}
      DB_PROCESS_ROLE: worker
      HABIBI_DEPLOYED: "1"
      DB_POOL_SIZE: ${BATCH_DB_POOL_SIZE:-2}
      DB_MAX_OVERFLOW: ${BATCH_DB_MAX_OVERFLOW:-1}
      APP_RELEASE: ${IMAGE_TAG:-local}
    command: ["python", "-m", "wk_batch"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s

  bot_worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    image: "${IMAGE_PREFIX:-}collections-api:${IMAGE_TAG:-local}"
    container_name: collections_bot_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-collections}:${POSTGRES_PASSWORD:-collections}@db:5432/${POSTGRES_DB:-collections}
      MINIO_ENDPOINT: minio:9000
      MINIO_SECURE: "false"
      DB_PROCESS_ROLE: bot_worker
      HABIBI_DEPLOYED: "1"
      DB_POOL_SIZE: ${BOT_WORKER_DB_POOL_SIZE:-3}
      DB_MAX_OVERFLOW: ${BOT_WORKER_DB_MAX_OVERFLOW:-2}
      APP_RELEASE: ${IMAGE_TAG:-local}
    command: ["python", "-m", "bot_worker"]
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s

  voice:
    build:
      context: .
      dockerfile: Dockerfile
      target: voice
    image: "${IMAGE_PREFIX:-}collections-voice:${IMAGE_TAG:-local}"
    container_name: collections_voice
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-collections}:${POSTGRES_PASSWORD:-collections}@db:5432/${POSTGRES_DB:-collections}
      MINIO_ENDPOINT: minio:9000
      MINIO_SECURE: "false"
      DB_PROCESS_ROLE: voice
      HABIBI_DEPLOYED: "1"
      DB_POOL_SIZE: ${VOICE_DB_POOL_SIZE:-3}
      DB_MAX_OVERFLOW: ${VOICE_DB_MAX_OVERFLOW:-2}
      REDIS_URL: redis://redis:6379/0
      APP_RELEASE: ${IMAGE_TAG:-local}
    volumes:
      # See the api service — filesystem fallback for voice_session_store only.
      - voice_sessions:/app/.cache/voice_sandbox_sessions
    command: ["python", "-m", "voice.bot", "--host", "0.0.0.0", "--port", "7860"]
    # Pipecat runner — must bind 0.0.0.0 for published ports.
    ports:
      - "127.0.0.1:${VOICE_PORT:-7860}:7860"
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # The runner's event loop is what / answers; a wedged Pipecat
      # process fails this. start_period covers the measured import warm
      # (~33s) plus Silero / Smart Turn / LLM class init.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:7860/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

volumes:
  pgdata:
  minio_data:
  voice_sessions:
