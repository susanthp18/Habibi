# Pipecat evals — collections happy paths (run via: python -m pipecat.evals ...)
# Transport: eval (see voice/bot.py EvalTransportParams).
#
# Scenarios exercise the shared domain tools through the voice bot entrypoint.
# Keep prompts short — these are smoke evals, not full conversation soak tests.

name: collections_happy_paths
transport: eval
bot: voice.bot:bot

scenarios:
  - name: promise_to_pay_happy
    description: Caller verifies and commits to a PTP
    turns:
      - user: "Hi, this is about my loan payment."
      - user: "Yes I can pay five thousand next Friday."
    expect:
      tools_called:
        - create_promise_to_pay
      no_phrases:
        - "connecting you"
        - "transferring you now"

  - name: dispute_paid_already
    description: Caller disputes with paid_already type
    turns:
      - user: "I already paid this last week."
    expect:
      tools_called:
        - flag_dispute
      tool_args:
        flag_dispute:
          type: paid_already

  - name: upsell_lead_capture
    description: Eligible upsell consent creates a lead
    turns:
      - user: "Sure, tell me about the insurance top-up."
      - user: "Yes, please have someone call me about it."
    expect:
      tools_called:
        - check_product_eligibility
        - capture_lead

  - name: escalate_honest_handoff
    description: Escalate never promises a live connect on callback_queue
    turns:
      - user: "I want to speak to a human supervisor right now."
    expect:
      tools_called:
        - escalate_to_human
      no_phrases:
        - "connecting you now"
        - "transferring you now"
