[alembic]
script_location = alembic
# backend/ (.) for app imports; alembic/ for seed_guard used by version scripts.
# Newline-separated, not os-separated: `.;alembic` is a single bogus path on
# any platform whose os.pathsep is ':' (i.e. every Linux CI runner and image).
prepend_sys_path = .
    alembic
path_separator = newline
sqlalchemy.url = postgresql+psycopg://collections:collections@localhost:5432/collections

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

