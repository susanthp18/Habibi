name: Frontend typecheck

on:
  push:
    paths:
      - "Habibi/**"
      - ".github/workflows/frontend-typecheck.yml"
  pull_request:
    paths:
      - "Habibi/**"
      - ".github/workflows/frontend-typecheck.yml"

jobs:
  tsc:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Habibi

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Habibi/package-lock.json

      - name: Install dependencies
        run: npm ci

      # A CVE against this lockfile was noticed by no mechanism in this
      # repository. --audit-level=high is what is green today; moderate
      # findings stay in the log without failing the job. --package-lock-only
      # audits the lock npm ci just installed from (the non-lockfile
      # endpoint is retiring and 400s on a drifted node_modules tree).
      # A gate introduced red is a gate people learn to ignore.
      - name: npm audit
        run: npm audit --audit-level=high --package-lock-only

      - name: Typecheck
        run: npx tsc --noEmit

      # Both of these were already written, already passing, and gated by
      # nothing. `test` is the vitest suites (36 files today) covering the pure
      # functions this app makes decisions with; `lint` is eslint plus two
      # hand-written scanners that check every spacing and type value against
      # the design scale — check-spacing-scale.mjs exists because a 1000px
      # padding shipped. Running them costs ~25s and retroactively activates all
      # of it.
      #
      # `lint` currently emits 62 react-hooks warnings and zero errors, so it
      # passes as-is. Deliberately NOT --max-warnings 0: gate what passes today,
      # then drive the count down. A gate introduced red is a gate people learn
      # to ignore.
      - name: Vitest
        run: npx vitest run

      - name: Lint
        run: npm run lint

      # CI never built the console. `nitro` is pinned to the dated beta
      # `3.0.260603-beta` (package.json), so a Vite/Nitro break that typecheck
      # and vitest do not see is currently invisible until someone runs
      # `npm run build` by hand. The measured baseline (2026-09-03) is green;
      # keep it that way.
      - name: Build
        run: npm run build

  # The card mirror is TypeScript pinned against a pydantic model, so the pin has
  # to run on the side that can break it. backend-pytest also covers this now via
  # its path filter, but that job needs Postgres and the full lockfile; this one
  # needs pydantic and forty seconds, so a frontend PR gets the answer immediately.
  #
  # It only became possible when agent_core/__init__ stopped eagerly importing
  # deployment -> db: before that, reading a pydantic model pulled in SQLAlchemy,
  # psycopg and httpx.
  #
  # CI is set by Actions, which is what makes conftest.frontend_file fail here
  # rather than skip.
  contract-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # sqlalchemy only because tests/conftest imports it for the DB fixtures.
      - run: pip install pydantic pytest sqlalchemy

      - name: Contract drift
        working-directory: backend
        run: |
          python -m pytest -q \n            tests/test_agent_card_schema_drift.py \n            tests/test_studio_contract_drift.py
