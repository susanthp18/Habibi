name: Backend nightly

# The alembic upgrade/downgrade roundtrip is opt-in in the suite
# (RUN_ALEMBIC_ROUNDTRIP=1, TEST_DATABASE_URL naming a scratch database)
# because it replays a destructive downgrade. Nightly, against a database
# that exists only for this job, it is exercised rather than trusted.
on:
  schedule:
    - cron: "30 21 * * *" # 03:00 IST
  workflow_dispatch:

jobs:
  alembic-roundtrip:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: collections
          POSTGRES_PASSWORD: collections
          POSTGRES_DB: collections
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collections -d collections"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://collections:collections@localhost:5432/collections
      APP_ENV: dev
      ALEMBIC_SEED_DEMO: ""
      PII_ENCRYPTION_KEY: ci-only-pii-key-not-for-any-deployment

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt

      # The roundtrip refuses a database whose name does not say it is
      # scratch (tests/test_migrations.py); this one is created for the run.
      - name: Create the scratch database
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://collections:collections@localhost:5432/collections", autocommit=True) as conn:
              conn.execute("CREATE DATABASE collections_ci_scratch")
          with psycopg.connect("postgresql://collections:collections@localhost:5432/collections_ci_scratch", autocommit=True) as conn:
              conn.execute("CREATE EXTENSION IF NOT EXISTS vector")
          PY

      - name: Alembic upgrade head, downgrade -1, upgrade head
        run: pytest -q -p no:cacheprovider --no-header tests/test_migrations.py -k roundtrip
        env:
          RUN_ALEMBIC_ROUNDTRIP: "1"
          TEST_DATABASE_URL: postgresql+psycopg://collections:collections@localhost:5432/collections_ci_scratch
