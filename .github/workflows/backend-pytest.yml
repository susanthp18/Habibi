name: Backend pytest

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-pytest.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-pytest.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: collections
          POSTGRES_PASSWORD: collections
          POSTGRES_DB: collections
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collections -d collections"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://collections:collections@localhost:5432/collections
      APP_ENV: dev
      API_KEY: ci-test-api-key
      ACTOR_USER_ID: priya-nair
      ALLOW_ACTOR_HEADER: "true"
      # Schema-only migrate; demo rows via scripts/seed_demo.py (not Alembic).
      ALEMBIC_SEED_DEMO: ""
      # seed_susanth._test_phone() refuses a hard-coded fallback, and it is right
      # to: that number receives real WhatsApp during testing, so a default either
      # points at a person's handset or seeds an undeliverable number that looks
      # configured. But the refusal is fatal — seed_demo.py calls seed_postgres,
      # which calls seed_susanth unguarded — so with this unset the "Seed demo
      # graph" step raises and **Pytest never runs at all**. Every test in this
      # repository was decorative until this line existed. CI needs no real
      # recipient (nothing sends here: platform_switches seeds no row and absence
      # is off), so a non-routable placeholder keeps the seed honest.
      WHATSAPP_TEST_TO: "910000000000"
      # Placeholders, not credentials. `azure_openai.get_client()` calls
      # `_require` on these at construction, and the tests that failed without
      # them are about connection pooling and timeout inheritance -- they build a
      # client and inspect it, they never call Azure. Without values the config
      # error is raised before the thing under test exists, so the suite reported
      # a missing env var where it meant to report a pool.
      #
      # A non-routable endpoint keeps that honest: anything that does try to
      # reach the network fails loudly here rather than quietly talking to
      # something real.
      AZURE_OPENAI_API_KEY: "ci-not-a-real-key"
      AZURE_OPENAI_API_VERSION: "2024-10-21"
      AZURE_OPENAI_ENDPOINT: "https://ci.invalid/"
      AZURE_OPENAI_CHAT_DEPLOYMENT: "ci-chat"
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT: "ci-embedding"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 26 test files import pipecat at module scope and cannot even be
      # collected without it -- every one of them covering the voice runtime,
      # which is the regulated channel. requirements-voice.txt is kept out of
      # requirements.txt so a CRM API upgrade is not coupled to Pipecat's
      # transitive graph; that separation is about the app image, not about what
      # CI is allowed to know. Skipping them here would leave the highest-risk
      # code in the product as the only code with no gate on it.
      #
      # It is pinned and deliberately narrow -- speechmatics and its ~1GB of ML
      # runtime are excluded on purpose -- so this costs install time, not a
      # dependency argument.
      - name: Install voice dependencies
        run: pip install -r requirements-voice.txt

      # Before the database steps on purpose: ruff needs no Postgres, so a lint
      # failure costs ten seconds instead of the ninety it takes to build and
      # seed a schema that is about to be thrown away.
      - name: Ruff
        run: ruff check .

      - name: Apply base SQL schema
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import psycopg
          dsn = os.environ["DATABASE_URL"].replace("postgresql+psycopg://", "postgresql://", 1)
          sql_dir = Path("sql")
          files = sorted(sql_dir.glob("*.sql"))
          assert files, "no sql/*.sql found"
          with psycopg.connect(dsn) as conn:
              conn.execute("CREATE EXTENSION IF NOT EXISTS vector")
              for f in files:
                  conn.execute(f.read_text(encoding="utf-8"))
                  print("applied", f.name)
              conn.commit()
          PY

      # sql/*.sql IS the authoritative current schema; revision 20260721_0001 is
      # an intentional no-op that baselines it. Migrations 0002+ are deltas that
      # are ALREADY reflected in sql/, so replaying them here raises
      # DuplicateColumn (19 add_column calls collide). Stamp instead of upgrade.
      # Chain integrity is asserted separately by tests/test_migrations.py.
      - name: Stamp Alembic at head (schema already applied above)
        run: alembic stamp head
        env:
          ALEMBIC_SEED_DEMO: ""

      - name: Assert schema matches Alembic expectations
        run: |
          python - <<'PY'
          import os, re, psycopg
          from pathlib import Path
          dsn = os.environ["DATABASE_URL"].replace("postgresql+psycopg://", "postgresql://", 1)
          with psycopg.connect(dsn) as conn:
              have_cols = {
                  (t, c)
                  for t, c in conn.execute(
                      "SELECT table_name, column_name FROM information_schema.columns"
                      " WHERE table_schema='public'"
                  ).fetchall()
              }
              have_tables = {t for t, in conn.execute(
                  "SELECT table_name FROM information_schema.tables WHERE table_schema='public'"
              ).fetchall()}

          # Derive expectations from the migrations themselves rather than a
          # hand-kept list — a new op.create_table/add_column that never lands in
          # sql/*.sql fails here instead of at runtime. (idempotency_keys was
          # missing this way: every "idempotent" write silently duplicated.)
          src = "\n".join(
              p.read_text(encoding="utf-8")
              for p in sorted(Path("alembic/versions").glob("*.py"))
          )
          want_tables = set(re.findall(r'op\.create_table\(\s*["\'](\w+)["\']', src))
          want_cols = set(re.findall(
              r'op\.add_column\(\s*["\'](\w+)["\']\s*,\s*sa\.Column\(\s*["\'](\w+)["\']', src))

          missing = [f"table {t}" for t in sorted(want_tables) if t not in have_tables]
          missing += [
              f"{t}.{c}" for t, c in sorted(want_cols)
              if t in have_tables and (t, c) not in have_cols
          ]
          if missing:
              raise SystemExit(
                  "sql/*.sql is behind Alembic; missing: " + ", ".join(missing)
              )
          print(f"schema drift check passed ({len(want_tables)} tables, {len(want_cols)} columns verified)")
          PY

      # The check above derives its expectations from op.create_table /
      # op.add_column, so it catches "sql/ is behind Alembic" — one direction.
      # It cannot catch the reverse: a column declared in sql/*.sql that no
      # migration creates, which every FRESH database has and every EXISTING
      # deployment silently lacks. That asymmetry never shows up in development,
      # because developers run against fresh databases. Three columns had
      # drifted this way before tests/test_schema_parity.py went in.
      - name: Create scratch database for schema parity
        run: |
          PGPASSWORD=collections psql -h localhost -U collections -d collections \
            -c "DROP DATABASE IF EXISTS collections_parity" \
            -c "CREATE DATABASE collections_parity"

      # tests/test_rls.py enables FORCE ROW LEVEL SECURITY and creates a login
      # role, so it needs a database of its own that it is free to rebuild.
      # Without it the enforcement half of that file skips, and the derivation
      # half — which needs no scratch database — still runs.
      - name: Create scratch database for row-level security
        run: |
          PGPASSWORD=collections psql -h localhost -U collections -d collections \
            -c "DROP DATABASE IF EXISTS collections_rls" \
            -c "CREATE DATABASE collections_rls"

      - name: Seed demo graph
        run: python scripts/seed_demo.py

      - name: Pytest
        run: pytest -q
        env:
          RUN_ALEMBIC_ROUNDTRIP: "0"
          SCHEMA_PARITY_DATABASE_URL: postgresql://collections:collections@localhost:5432/collections_parity
          RLS_DATABASE_URL: postgresql://collections:collections@localhost:5432/collections_rls
