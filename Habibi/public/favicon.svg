<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" role="img" aria-label="BigBound AI">
  <title>BigBound AI</title>
  <!--
    Tab icon — equalizer lockup on the same navy plate as the previous monogram.
    Bounding box is centered, then nudged 2 units up so ascending-bar ink
    doesn't read as sitting on the floor. Previous: favicon-monogram.svg.

    Regenerate the PNGs after editing:  npm run icons
  -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#12305A"/>
      <stop offset="1" stop-color="#071A33"/>
    </linearGradient>
  </defs>

  <rect width="40" height="40" rx="8.75" fill="url(#plate)"/>

  <g fill="#FFFFFF">
    <rect x="6.8" y="25.8" width="3.8" height="5.2" rx="0.9"/>
    <rect x="12.45" y="20.6" width="3.8" height="10.4" rx="0.9"/>
    <rect x="18.1" y="15.4" width="3.8" height="15.6" rx="0.9"/>
    <rect x="23.75" y="10.2" width="3.8" height="20.8" rx="0.9"/>
    <rect x="29.4" y="5" width="3.8" height="26" rx="0.9"/>
  </g>
  <circle cx="14.35" cy="18.2" r="2.4" fill="#4BA3FF"/>
</svg>
