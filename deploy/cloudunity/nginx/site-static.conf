# The PayInt marketing site inside its payint_site_prod_* container: the
# prerendered static build (Site/dist/client), one index.html per route.
# The host nginx proxies / to this container through `upstream payint_site`.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Behind the host proxy: a redirect must not name this container's port.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    # nginx drops server-level add_header lines in any location that sets its
    # own, so each location repeats the security headers. HSTS is safe here:
    # the host already redirects every http request to https.

    # Content-hashed by Vite, so they never change under a name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }
    location /videos/ {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        try_files $uri $uri/ $uri/index.html =404;
    }
    # Unknown paths get the home page (what the client router renders for
    # them), with a 404 status so crawlers do not index them.
    error_page 404 /index.html;
}
